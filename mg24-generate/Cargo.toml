[package]
name = "mg24-generate"
version = "0.4.1"
edition = "2021"
description = "Interactive TUI and CLI project generator for mg24-hal (EFR32MG24 HAL)"
license = "MIT"
repository = "https://github.com/fr9rx/mg24-hal"
authors = ["fr9rx"]
keywords = ["mg24", "efr32", "embedded", "generator", "tui"]
categories = ["command-line-utilities", "embedded"]

[[bin]]
name = "mg24-generate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
cursive = { version = "0.20", default-features = false, features = ["pancurses"] }

[profile.release]
opt-level = 3
lto = true
