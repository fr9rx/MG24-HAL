[workspace]
members = ["macros"]

[package]
name = "mg24-hal"
version = "2.0.0"
edition = "2024"
description = "HAL for Silicon Labs MG24 microcontroller"
license = "MIT"
repository = "https://github.com/fr9rx/mg24-hal"
readme = "README.md"
keywords = ["embedded", "hal", "mg24", "no-std"]
categories = ["embedded", "no-std"]

[lib]
bench = false
test  = false


[dependencies]
# `default-features = false` drops the PAC's `critical-section` feature, which
# only gates its `Peripherals::take()`. This crate does not use it, and pulling
# in `critical-section` with no registered impl is a link error waiting to
# happen.
efr32mg24-pac = { version = "0.1.0", default-features = false }
embedded-hal = "1.0.0"
mg24-hal-macros = { version = "2.0.0", path = "macros" }


[[example]]
name = "blink"
path = "examples/blink.rs"


[[example]]
name = "button"
path = "examples/button.rs"


[[example]]
name = "open_drain"
path = "examples/open_drain.rs"


[[example]]
name = "gpio_interrupt"
path = "examples/gpio_interrupt.rs"


[[example]]
name = "flex"
path = "examples/flex.rs"


[[example]]
name = "cpu_speed"
path = "examples/cpu_speed.rs"


[profile.release]
# One codegen unit plus LTO lets the optimiser see across crate boundaries,
# which matters here: the pin identity is a runtime `AnyPin`, and constant
# propagation through the inlined constructors is what folds it back to a
# compile-time constant.
codegen-units = 1
lto = true
# DWARF lives in the ELF, not in a LOAD segment, so this costs no flash and
# keeps probe-rs able to name symbols in a release image.
debug = true


[features]
default = ["panic-handler"]

# Provides the `#[panic_handler]`. Turn this off to supply your own, or to use
# something like `panic-probe`.
panic-handler = []


[[example]]
name = "logging"
path = "examples/logging.rs"


[[example]]
name = "i2c"
path = "examples/i2c.rs"

[[example]]
name = "i2c_scan"
path = "examples/i2c_scan.rs"

[[example]]
name = "i2c_scan_full"
path = "examples/i2c_scan_full.rs"
